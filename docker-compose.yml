# ══════════════════════════════════════════════════════════════════════════════
#  Précis Translator — la pile complète
#
#      docker compose --env-file backend/.env up -d --build
#
#  LE `--env-file` N'EST PAS OPTIONNEL, et le raccourci `scripts/precis.sh` est
#  là pour ne pas avoir à s'en souvenir. Sans lui, Compose lit un `.env` à la
#  racine — un second fichier de secrets, qui divergerait du premier. Or c'est
#  exactement le défaut que l'on vient de corriger : une clé présente à deux
#  endroits finit par différer, et l'interface reçoit un 401 que rien n'explique.
#
#  UNE SEULE SOURCE : `backend/.env`.
# ══════════════════════════════════════════════════════════════════════════════

services:

  # ── La base de données ─────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      # `:?` fait ÉCHOUER le démarrage avec ce message si la variable manque,
      # au lieu de créer silencieusement une base « postgres/postgres » que
      # personne n'a voulue et que tout le monde peut ouvrir.
      POSTGRES_USER: ${POSTGRES_USER:?a definir dans backend/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?a definir dans backend/.env}
      POSTGRES_DB: ${POSTGRES_DB:-precis}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # AUCUN port publié. La base n'est joignable que par les autres conteneurs.
    # L'exposer sur l'Internet, c'est offrir à quiconque scanne le port 5432 un
    # nombre illimité d'essais de mot de passe.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ── Le service de traduction ───────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file:
      - backend/.env
    environment:
      # Ces trois valeurs ÉCRASENT le `.env`, et c'est voulu.
      #
      # DATABASE_URL est DÉRIVÉE des trois variables POSTGRES_* ci-dessus au
      # lieu d'être recopiée : des identifiants écrits deux fois finissent par
      # différer, et l'on cherche alors pendant une heure pourquoi le service ne
      # se connecte plus à une base qui fonctionne très bien. Dans le `.env`,
      # DATABASE_URL reste réglée sur `localhost` — c'est ce qu'il faut pour
      # travailler hors conteneur, et Compose la remplace ici par `db`, le nom
      # de l'autre conteneur.
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-precis}
      PRECIS_ENV: ${PRECIS_ENV:-production}
    volumes:
      # LE point qui distingue cet hébergement des offres gratuites : ce volume
      # SURVIT à la reconstruction de l'image. Reconstruire l'application
      # n'efface ni les documents traduits, ni les aperçus en cache.
      #
      # Le chemin n'est pas configurable et n'a pas à l'être : `config.py`
      # DÉRIVE TRANSLATIONS_DIR de l'emplacement du code (`backend/`), sans lire
      # aucune variable. Monter ailleurs donnerait un volume que rien n'écrit.
      - translations:/app/backend/translations
    depends_on:
      db:
        condition: service_healthy
    # Aucun port publié non plus : seul nginx parle au service, par le réseau
    # interne. Publier 8000 offrirait un chemin direct qui contourne les
    # limites de taille et de délai réglées dans nginx.

  # ── L'interface ────────────────────────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        # La clé de l'interface est la MÊME que celle du service, prise à la
        # même ligne du même fichier. Impossible qu'elles divergent.
        VITE_API_KEY: ${FRONTEND_API_KEY:?a definir dans backend/.env}
        VITE_API_BASE: ""
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    restart: unless-stopped
    ports:
      # Le seul port ouvert sur l'extérieur. À l'étape 4, le 443 (HTTPS) le
      # rejoindra et le 80 ne servira plus qu'à rediriger vers lui.
      - "80:80"
    depends_on:
      - backend

volumes:
  # Volumes NOMMÉS et non dossiers du disque : ils survivent à
  # `docker compose down`, et seul un `down -v` explicite les efface.
  # À l'étape 3, ils seront posés sur le disque de 200 Go d'Oracle.
  pgdata:
  translations:
